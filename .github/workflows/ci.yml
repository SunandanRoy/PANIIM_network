name: ci
on:
  push:
    branches: [main, "claude/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build SQL bundle (must be committed and up to date)
        run: pnpm build:sql && git diff --exit-code dist/
      - name: SQL tests (RLS, 96-case privacy matrix, behaviour, performance)
        run: pnpm test:sql
      - name: RLS probe against the local API
        run: |
          pnpm db:setup
          NET_DB=net_dev node harness/api/server.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:54321/harness/users >/dev/null && break; sleep 1; done
          pnpm probe:local
      - name: Bundle size and service-key check
        run: pnpm size
      - name: Secret scan
        run: pnpm secrets
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: pnpm e2e

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
